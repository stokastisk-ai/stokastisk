name: cpu-ci
# The complete CPU-only verification. It never requests a GPU, a Kaggle session or a model: it runs the full test suite, rebuilds the wheel from the byte-pinned vLLM wheel and audits it
# (RECORD, Flash-free, native-binary identity, reproducibility, and member-for-member identity with the published wheel). Downloads are hash-checked against RELEASE.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/ci.txt -r requirements/docs.txt
      - name: CPU-only PyTorch (the same 2.11.0 the project targets; three test modules import torch and never touch a GPU)
        run: python -m pip install "torch==2.11.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch the byte-pinned vLLM wheel (hash-checked) so no test is skipped for its absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D inputs
          echo "cc3bcafb6516791990ca302073ae153a08465d3df1e460d666e3ec09b4e98f5e  inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl" | sha256sum -c -
      - name: Project version lock
        run: python scripts/release/verify_project_version.py
      - name: Full CPU test suite
        run: CUDA_VISIBLE_DEVICES= python -m pytest tests -p no:cacheprovider -q -rs
      - name: Generated documentation is current (API reference, feature matrix)
        run: |
          python scripts/release/build_docs_site.py /tmp/site-docs
          git diff --exit-code docs/guide/api-reference.md docs/guide/feature-matrix.md
      - name: Evidence manifest matches the archived artifacts
        run: |
          python scripts/audit/build_evidence_manifest.py
          git diff --exit-code evidence/kaggle/evidence-manifest.json
  # ---------------------------------------------------------------------------------------------------------------------------------------------------
  # Three separate questions, three strict jobs (none is skipped or soft):
  #   release-integrity      the PUBLISHED build-5 file is exactly the bytes RELEASE.json and its archived release manifest record
  #   release-reproduction   rebuilding build 5 from its RECORDED source commit (evidence/release/build-5/release-manifest.json) yields those exact bytes
  #   candidate-audit        the CURRENT source builds a distinct, reproducible candidate (release-candidates/*.json) whose only differences from build 5
  #                          are the declared ones; vLLM tree, native CUDA objects and the Flash-free policy are verified as before
  # Previously one job rebuilt "build 5" from whatever source was checked out, so any SDK change necessarily failed it.
  release-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Published build 5 and the pinned vLLM input match RELEASE.json and the archived build-5 manifest (hash and size)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs dist/ref
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D inputs
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          rel = json.load(open("RELEASE.json")); man = json.load(open("evidence/release/build-5/release-manifest.json"))
          w = rel["builds"]["5"]
          assert rel["current_build"] == 5 and man["build_tag"] == "5"
          assert (w["filename"], w["sha256"], w["size"]) == (man["wheel"]["filename"], man["wheel"]["sha256"], man["wheel"]["size"]), "RELEASE.json disagrees with the archived manifest"
          v = pathlib.Path("inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl")
          assert hashlib.sha256(v.read_bytes()).hexdigest() == rel["base_vllm_wheel"]["sha256"] == man["base_vllm_wheel"]["sha256"]
          dst = pathlib.Path("dist/ref") / w["filename"]; urllib.request.urlretrieve(w["url"], dst)
          got = hashlib.sha256(dst.read_bytes()).hexdigest()
          assert got == w["sha256"] and dst.stat().st_size == w["size"], (got, dst.stat().st_size)
          print("published build 5 verified:", got, dst.stat().st_size, "bytes")
          PY

  release-reproduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check out the recorded build-5 source commit (from the archived release manifest) into its own worktree
        run: |
          COMMIT=$(python3 -c 'import json; m=json.load(open("evidence/release/build-5/release-manifest.json")); assert m["source"]["tracked_files_modified_at_build"] == []; print(m["source"]["git_commit"])')
          echo "build-5 source commit: $COMMIT"
          git worktree add --detach "$RUNNER_TEMP/build5-src" "$COMMIT"
          test "$(git -C "$RUNNER_TEMP/build5-src" rev-parse HEAD)" = "$COMMIT"
      - name: Tooling exactly as pinned at that commit
        run: python -m pip install -r "$RUNNER_TEMP/build5-src/requirements/ci.txt"
      - name: Inputs (hash-checked against RELEASE.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/build5-src/inputs" dist/ref
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D "$RUNNER_TEMP/build5-src/inputs"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          rel = json.load(open("RELEASE.json")); w = rel["builds"]["5"]
          v = pathlib.Path(os.environ["RUNNER_TEMP"]) / "build5-src/inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl"
          assert hashlib.sha256(v.read_bytes()).hexdigest() == rel["base_vllm_wheel"]["sha256"]
          dst = pathlib.Path("dist/ref") / w["filename"]; urllib.request.urlretrieve(w["url"], dst)
          assert hashlib.sha256(dst.read_bytes()).hexdigest() == w["sha256"]
          PY
      - name: Rebuild build 5 from the recorded source and prove reproducibility
        run: |
          cd "$RUNNER_TEMP/build5-src"
          python scripts/release/build_wheel_release.py --build-tag 5 --out "$GITHUB_WORKSPACE/dist/wheel-build5" --reproduce
      - name: The rebuilt build 5 is byte-for-byte the published file (and member-for-member)
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          rel = json.load(open("RELEASE.json")); w = rel["builds"]["5"]
          pub = zipfile.ZipFile("dist/ref/" + w["filename"]); new = zipfile.ZipFile("dist/wheel-build5/" + w["filename"])
          assert sorted(pub.namelist()) == sorted(new.namelist())
          diff = [n for n in pub.namelist() if pub.read(n) != new.read(n)]
          assert not diff, diff[:5]
          got = hashlib.sha256(open("dist/wheel-build5/" + w["filename"], "rb").read()).hexdigest()
          assert got == w["sha256"], ("rebuilt bytes differ from the published file", got)
          print("all", len(pub.namelist()), "members identical; rebuilt sha256", got, "== published")
          PY

  candidate-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/ci.txt
      - name: Inputs (hash-checked against RELEASE.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs dist/ref
          gh release download v0.1.0 -R ${{ github.repository }} -p 'vllm-0.25.1-cp38-abi3-linux_x86_64.whl' -D inputs
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          rel = json.load(open("RELEASE.json")); w = rel["builds"]["5"]
          assert hashlib.sha256(pathlib.Path("inputs/vllm-0.25.1-cp38-abi3-linux_x86_64.whl").read_bytes()).hexdigest() == rel["base_vllm_wheel"]["sha256"]
          dst = pathlib.Path("dist/ref") / w["filename"]; urllib.request.urlretrieve(w["url"], dst)
          assert hashlib.sha256(dst.read_bytes()).hexdigest() == w["sha256"]
          PY
      - name: Build the declared candidate from the current source, audit it against build 5, rebuild to prove reproducibility
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          for f in sorted(pathlib.Path("release-candidates").glob("build-*.json")):
              c = json.load(open(f)); tag = c["build_tag"]
              rel = json.load(open("RELEASE.json"))
              assert tag not in rel["builds"] and tag not in rel.get("withdrawn_builds", {}), f"candidate tag {tag} collides with a published or withdrawn build"
              ref = "dist/ref/" + rel["builds"][c["reference_build"]]["filename"]
              cmd = [sys.executable, "scripts/release/build_wheel_release.py", "--build-tag", tag, "--out", f"dist/candidate-{tag}", "--reproduce", "--reference-wheel", ref]
              for a in c["allow_sdk"]: cmd += ["--allow-sdk", a]
              if c.get("requires_compat"): cmd += ["--requires-compat", c["requires_compat"]]
              subprocess.run(cmd, check=True)
          PY
      - name: Candidate verdict (verification, native binaries, Flash policy, delta, reproducibility, exact member changes)
        run: |
          python3 - <<'PY'
          import json, pathlib
          for f in sorted(pathlib.Path("release-candidates").glob("build-*.json")):
              c = json.load(open(f)); out = pathlib.Path(f"dist/candidate-{c['build_tag']}")
              man = json.load(open(out / "release-manifest.json")); a = man["audits"]
              delta = json.load(open(out / "reports/delta-vs-reference.json"))
              changed = sorted(r["member"] for r in delta["changed_members"])
              print(json.dumps({"candidate": man["wheel"], "verify": a["verify_integrated_wheel"], "native": a["native_binary_comparison_with_pinned_vllm"],
                                "flash": a["flash_removal_audit"], "delta": delta["status"], "reproducible": a["reproducible_build"], "changed": changed}, indent=1))
              assert a["verify_integrated_wheel"]["status"] == "PASS", a["verify_integrated_wheel"]
              assert a["record_verified"] is True
              assert a["native_binary_comparison_with_pinned_vllm"] and all(s == "PASS" for s in a["native_binary_comparison_with_pinned_vllm"])
              assert a["flash_removal_audit"] and all(s == "PASS" for s in a["flash_removal_audit"])
              assert delta["status"] == "PASS", [x for x in delta["checks"] if x["status"] != "PASS"]
              assert delta["summary"]["vllm_members_identical"] and delta["summary"]["native_binaries_identical"]
              assert not delta["summary"]["added"] and not delta["summary"]["removed"], (delta["summary"]["added"], delta["summary"]["removed"])
              assert a["reproducible_build"]["identical"] is True, a["reproducible_build"]
              assert changed == sorted(c["expected_changed_members"]), ("undeclared member changes", sorted(set(changed) ^ set(c["expected_changed_members"])))
              print("candidate build", c["build_tag"], "OK:", man["wheel"]["sha256"], man["wheel"]["size"], "bytes (NOT published)")
          PY
